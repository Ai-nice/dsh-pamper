<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #00ff00; overflow: hidden; }
    #stage { position: fixed; inset: 0; pointer-events: none; }
    .pet { position: absolute; display: block; }
    .pet img { display: block; width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script>
    const params = new URLSearchParams(location.search);
    let state = { pets: [] };
    try { state = JSON.parse(params.get('state') || '{}'); } catch {}
    const stage = document.getElementById('stage');
    const toFileUrl = (filePath) => encodeURI('file:///' + String(filePath).replace(/\\/g, '/').replace(/^\/+/, ''));
    for (const pet of state.pets || []) {
      const width = Math.max(120, Math.min(Number(pet.size) || 420, 900));
      const holder = document.createElement('div');
      holder.className = 'pet';
      holder.style.width = width + 'px';
      holder.style.height = Math.round(width * 9 / 16) + 'px';
      const corner = pet.corner || 'top-right';
      const mx = Number(pet.marginX) || 24;
      const my = Number(pet.marginY) || 100;
      if (corner.includes('left')) holder.style.left = mx + 'px'; else holder.style.right = mx + 'px';
      if (corner.includes('bottom')) holder.style.bottom = my + 'px'; else holder.style.top = my + 'px';
      const image = document.createElement('img');
      image.src = toFileUrl(pet.file.replace(/\.webm$/i, '.png'));
      image.addEventListener('error', () => console.error('image error', image.src));
      holder.appendChild(image);
      stage.appendChild(holder);
      console.log('pamper helper: pet', pet.kind, image.src);
    }
  </script>
</body>
</html>
